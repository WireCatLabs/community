name: Security release

on:
  schedule:
    - cron: "47 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  checks:
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@339f1ea6dbd83235664821b43aac26897a3f2659 # v0.132.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
