name: Security release

on:
  schedule:
    - cron: "47 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  checks:
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@a579c725569e103afe548422b714bd72115aef53 # v0.65.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
