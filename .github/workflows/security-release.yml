name: Security release

on:
  schedule:
    - cron: "47 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  checks:
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@92629972be70b5c66ee20f75fac586dda13c540e # v0.96.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
