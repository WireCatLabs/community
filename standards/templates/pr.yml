name: Pull request validation

# The full Linux validation before merge, so a pull request that lowers coverage or breaks a contract
# fails here and not on main (WC-CI-5). The project's ci.yml must have `on: workflow_call`. Drop the
# `with:` block where ci.yml has no skip-platforms input: an undefined input fails the whole run.
on:
  pull_request:

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    with:
      skip-platforms: true
